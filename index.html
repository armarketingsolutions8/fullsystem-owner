<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - The Q Barbershop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#0f172a] text-white flex flex-col h-full shadow-lg">
        <div class="p-6 border-b border-gray-800 flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white shadow-sm">Q</div>
            <h2 class="text-lg font-bold uppercase tracking-wider">ADMIN PORTAL</h2>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 ml-2">Management</p>
            <a href="#" class="flex items-center gap-3 bg-[#1e293b] text-white px-4 py-3 rounded-lg font-medium shadow-sm">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                Live Queue
            </a>
            <a href="customer.html" target="_blank" class="flex items-center gap-3 text-gray-400 hover:text-white hover:bg-[#1e293b] px-4 py-3 rounded-lg font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                Open Customer Page
            </a>

            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mt-8 mb-2 ml-2">System</p>
            <div class="px-4 py-2 text-xs text-gray-400">
                Database: <span class="text-green-400 font-semibold">Connected</span>
            </div>
        </nav>
        
        <div class="p-4 border-t border-gray-800">
            <button onclick="alert('Logged out')" class="flex items-center gap-2 text-gray-400 hover:text-red-400 transition w-full px-2 py-2 text-sm font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Header -->
        <header class="bg-white shadow-sm px-8 py-5 flex justify-between items-center z-10 border-b border-gray-100">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Live Queue Management</h1>
            <div class="flex items-center gap-3 text-sm font-medium text-gray-600">
                <span>Tarikh:</span>
                <span id="currentDate" class="bg-gray-100 px-3 py-1.5 rounded-md font-semibold text-gray-800"></span>
            </div>
        </header>

        <!-- Content Body -->
        <div class="flex-1 overflow-y-auto p-8">
            
            <!-- Action Bar -->
            <div class="flex justify-between items-center mb-8">
                <button onclick="callNextQueue()" class="bg-[#111827] text-white px-6 py-3 rounded-xl font-bold hover:bg-gray-800 shadow-md flex items-center gap-2 transition transform active:scale-95">
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                    PANGGIL SETERUSNYA (CALL NEXT)
                </button>
                <div id="loadingIndicator" class="text-sm font-medium text-blue-600 animate-pulse">Menyelaras data live...</div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 flex justify-between items-center">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">WAITING</p>
                        <p id="statWaiting" class="text-3xl font-extrabold text-gray-900">0</p>
                    </div>
                    <div class="w-12 h-12 bg-yellow-50 text-yellow-600 rounded-xl flex items-center justify-center font-bold">⏳</div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 flex justify-between items-center">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">SERVING</p>
                        <p id="statServing" class="text-3xl font-extrabold text-gray-900">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-bold">✂️</div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 flex justify-between items-center">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">COMPLETED</p>
                        <p id="statCompleted" class="text-3xl font-extrabold text-gray-900">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-50 text-green-600 rounded-xl flex items-center justify-center font-bold">✓</div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 flex justify-between items-center">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">TOTAL QUEUE</p>
                        <p id="statTotal" class="text-3xl font-extrabold text-gray-900">0</p>
                    </div>
                    <div class="w-12 h-12 bg-gray-50 text-gray-600 rounded-xl flex items-center justify-center font-bold">📊</div>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-200">
                                <th class="p-4 font-semibold">NO. GILIRAN</th>
                                <th class="p-4 font-semibold">PELANGGAN</th>
                                <th class="p-4 font-semibold">SERVIS & BARBER</th>
                                <th class="p-4 font-semibold text-center">STATUS</th>
                                <th class="p-4 font-semibold text-right">TINDAKAN</th>
                            </tr>
                        </thead>
                        <tbody id="queueTableBody" class="divide-y divide-gray-100 text-sm">
                            <tr>
                                <td colspan="5" class="p-8 text-center text-gray-400">Memuatkan senarai giliran...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKVXr6MNUn6XiHCCRo69fiGa5BFmhHoSI",
            authDomain: "fullsystem-fbed2.firebaseapp.com",
            projectId: "fullsystem-fbed2",
            storageBucket: "fullsystem-fbed2.firebasestorage.app",
            messagingSenderId: "1074278839562",
            appId: "1:1074278839562:web:a2eddc8225c9d65c1076f3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Paparkan tarikh hari ini
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('ms-MY');

        let queueList = [];

        // Real-time Listener untuk koleksi 'queues'
        const qRef = query(collection(db, "queues"), orderBy("createdAt", "asc"));
        onSnapshot(qRef, (snapshot) => {
            queueList = [];
            snapshot.forEach((docSnap) => {
                queueList.push({ id: docSnap.id, ...docSnap.data() });
            });

            renderDashboard();
            document.getElementById('loadingIndicator').innerText = "Data dikemas kini secara langsung ✓";
            setTimeout(() => {
                document.getElementById('loadingIndicator').innerText = "";
            }, 3000);
        });

        // Paparkan Data ke dalam Statistik dan Jadual
        function renderDashboard() {
            let waitingCount = 0;
            let servingCount = 0;
            let completedCount = 0;
            let totalCount = queueList.length;

            const tbody = document.getElementById('queueTableBody');
            
            if (queueList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-400">Tiada senarai giliran buat masa ini.</td></tr>`;
                document.getElementById('statWaiting').innerText = 0;
                document.getElementById('statServing').innerText = 0;
                document.getElementById('statCompleted').innerText = 0;
                document.getElementById('statTotal').innerText = 0;
                return;
            }

            let html = "";

            queueList.forEach(item => {
                const status = item.status || 'Waiting';
                if (status === 'Waiting') waitingCount++;
                else if (status === 'Serving') servingCount++;
                else if (status === 'Completed') completedCount++;

                // Badge warna status
                let badgeClass = "bg-yellow-100 text-yellow-700";
                if (status === 'Serving') badgeClass = "bg-blue-100 text-blue-700";
                if (status === 'Completed') badgeClass = "bg-gray-100 text-gray-500";

                html += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="p-4 font-bold text-gray-900">${item.queueNumber || '-'}</td>
                        <td class="p-4">
                            <p class="font-semibold text-gray-900">${item.customerName || 'Tanpa Nama'}</p>
                            <p class="text-gray-500 text-xs">${item.phone || '-'}</p>
                        </td>
                        <td class="p-4">
                            <p class="font-semibold text-gray-800">${item.serviceName || 'Servis Standard'}</p>
                            <p class="text-gray-500 text-xs">Barber: ${item.barberName || 'Any'}</p>
                        </td>
                        <td class="p-4 text-center">
                            <span class="${badgeClass} px-3 py-1 rounded-full text-xs font-bold tracking-wide uppercase">${status}</span>
                        </td>
                        <td class="p-4 text-right space-x-2">
                            ${status === 'Waiting' ? `<button onclick="updateStatus('${item.id}', 'Serving')" class="bg-blue-600 text-white px-3 py-1.5 rounded-md font-semibold text-xs hover:bg-blue-700 shadow-sm transition">SERVE</button>` : ''}
                            ${status === 'Serving' ? `<button onclick="updateStatus('${item.id}', 'Completed')" class="bg-green-600 text-white px-3 py-1.5 rounded-md font-semibold text-xs hover:bg-green-700 shadow-sm transition">COMPLETE</button>` : ''}
                            <button onclick="deleteQueue('${item.id}')" class="bg-red-50 text-red-500 px-2.5 py-1.5 rounded-md font-semibold text-xs hover:bg-red-100 transition" title="Padam">✕</button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            document.getElementById('statWaiting').innerText = waitingCount;
            document.getElementById('statServing').innerText = servingCount;
            document.getElementById('statCompleted').innerText = completedCount;
            document.getElementById('statTotal').innerText = totalCount;
        }

        // Fungsi Tukar Status (Serve / Complete)
        window.updateStatus = async (id, newStatus) => {
            try {
                const ref = doc(db, "queues", id);
                await updateDoc(ref, { status: newStatus });
            } catch (err) {
                console.error("Ralat kemaskini status:", err);
                alert("Gagal mengemas kini status.");
            }
        };

        // Fungsi Butang Utama "Call Next"
        window.callNextQueue = async () => {
            // Cari pelanggan pertama yang statusnya 'Waiting'
            const nextCustomer = queueList.find(item => item.status === 'Waiting');
            if (!nextCustomer) {
                alert("Tiada pelanggan dalam senarai menunggu (Waiting).");
                return;
            }
            await updateStatus(nextCustomer.id, 'Serving');
        };

        // Fungsi Padam / Batal Giliran
        window.deleteQueue = async (id) => {
            if (confirm("Adakah anda pasti mahu memadam giliran ini?")) {
                try {
                    await deleteDoc(doc(db, "queues", id));
                } catch (err) {
                    console.error("Ralat memadam:", err);
                    alert("Gagal memadam data.");
                }
            }
        };
    </script>
</body>
</html>
